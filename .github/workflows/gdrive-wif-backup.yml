name: Backup sources to Google Drive (WIF)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-drive-wif-source-backup
  cancel-in-progress: false
jobs:
  backup:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/275708968587/locations/global/workloadIdentityPools/mkeiit-github/providers/github
          service_account: mkeiit-gh-backup@mkeiit-schedule-backup.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
      - name: Archive and update both Drive files
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          BACKUP_COMMIT: ${{ github.sha }}
        run: python3 tools/backup_google_drive_wif.py
